name = "shadowlock-download-tracker"
main = "src/index.js"
compatibility_date = "2026-09-05"
workers_dev = true
account_id = "ac575a9b822bea2bed97d0ab73aed238"

[[kv_namespaces]]
binding = "DOWNLOADS"
id = "4f4dcb1c12ff46cebec25a3cdd191ec4"

[assets]
directory = "./public"
binding = "ASSETS"
# /v1/* covers local /v1/{op} and /v1/mesh/* (AZIEL_RUNTIME proxy).
run_worker_first = ["/", "/download", "/download/*", "/stats", "/event", "/go", "/count", "/install.sh", "/v1", "/v1/*", "/openapi.json", "/ai", "/ai/*", "/mcp", "/mcp/", "/cite.json", "/robots.txt", "/sitemap.xml", "/llms.txt", "/ai.txt", "/sigil.png"]

[vars]
AZIEL_RUNTIME_ORIGIN = "https://aziel-runtime.vibelock.workers.dev"

[[services]]
binding = "AZIEL_RUNTIME"
service = "aziel-runtime"
